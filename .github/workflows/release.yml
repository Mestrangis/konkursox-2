name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Comprobar que el tag coincide con package.json
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con package.json ($PKG)"; exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Compilar instalador
        run: npm run dist

      # Se publica con gh en un solo paso: electron-builder --publish crea la release
      # dos veces en paralelo y deja duplicados que confunden al auto-update.
      - name: Publicar en GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME"             "release/KONKURSOX-Setup-$V.exe"             "release/KONKURSOX-Setup-$V.exe.blockmap"             "release/latest.yml"             --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
